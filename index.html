<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionAmigo - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            max-width: 1600px;
            width: 100%;
        }

        .screenshot {
            flex-shrink: 0;
            width: 472px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0.85;
            transition: opacity 0.3s, transform 0.3s;
        }

        .screenshot:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        .screenshot-left {
        }

        .screenshot-right {
        }

        .screenshot-left:hover {
            transform: scale(1.02);
        }

        .screenshot-right:hover {
            transform: scale(1.02);
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            flex-shrink: 0;
        }

        h1 {
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .tagline {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-size: 0.85rem;
        }

        form {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="email"] {
            padding: 14px 18px;
            font-size: 1rem;
            border: 1px solid #333;
            border-radius: 8px;
            background: #141414;
            color: #fff;
            width: 260px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus {
            border-color: #666;
        }

        input[type="email"]::placeholder {
            color: #555;
        }

        button {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid #333;
            border-radius: 8px;
            background: #141414;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #222;
        }

        button:active {
            transform: scale(0.98);
        }

        .success-message {
            display: none;
            color: #4ade80;
            margin-top: 1.5rem;
            font-size: 1rem;
        }

        @media (max-width: 1400px) {
            .screenshot {
                width: 360px;
            }
        }

        @media (max-width: 1200px) {
            .layout {
                flex-direction: column;
                gap: 40px;
            }

            .screenshot {
                width: 340px;
                transform: none !important;
            }

            .screenshot:hover {
                transform: scale(1.02) !important;
            }

            .screenshot-left {
                order: 2;
            }

            .screenshot-right {
                order: 3;
            }

            .container {
                order: 1;
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 2.2rem;
            }

            input[type="email"] {
                width: 100%;
            }

            button {
                width: 100%;
            }

            .screenshot {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <img src="screenshot1.png" alt="MotionAmigo UI" class="screenshot screenshot-left">
        
        <div class="container">
            <h1>MotionAmigo</h1>
            <p class="tagline">Your natural language assistant for After Effects</p>
            
            <form id="signup-form">
                <input type="email" name="email" id="email" placeholder="enter email to learn more" required>
                <button type="submit">Notify me</button>
            </form>
            
            <p class="success-message" id="success">Thanks! We'll let you know when we launch.</p>
        </div>

        <img src="screenshot2.png" alt="MotionAmigo Spiral Generator" class="screenshot screenshot-right">
    </div>

    <footer class="footer">Create Responsibly</footer>

    <script>
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const button = this.querySelector('button');
            button.textContent = '...';
            button.disabled = true;

            fetch('https://script.google.com/macros/s/AKfycbyJo2gYOiI24yvYK3GwoKsSnmvZAXmLbjx9Z2hJPHxeMSE_I7yGUc_vMKrgLRPrUQE/exec', {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            }).then(() => {
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('success').style.display = 'block';
            });
        });
    </script>
</body>
</html>
