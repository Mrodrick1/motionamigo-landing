<!DOCTYPE html>

<head>

  <style>
    @font-face {
      font-family: 'Big John Pro';
      src: url('BigJohnPRO-Bold.otf') format('opentype');

      font-style: normal;

    :root {
      --bg-darkest: #0a0a0a;
      --bg-dark: #141414;
      --bg-medium: #1a1a1f;
      --bg-light: #252530;
      --accent-primary: #3b7dd8;
      --accent-light: #6aadff;
      --accent-dark: #1a3a5c;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #707080;
      --border-color: #333;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-darkest);
      color: var(--text-secondary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 560px;
    }
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 40px;
    }
    .nav a {
      font-family: 'Big John Pro', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
    }
    h1 {
      font-family: 'Big John Pro', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 18px;
      font-weight: 300;
      color: var(--text-secondary);
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .download-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      margin-bottom: 32px;
    }
    .platform {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .version {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .download-btn {
      display: inline-block;
      background: transparent;
      border: 1px solid var(--accent-primary);
      color: #fff;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      transition: opacity 0.2s;
      margin-bottom: 16px;
    }
    .download-btn:hover { opacity: 0.85; }
    .file-size {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Email gate */
    .email-gate {
      margin-bottom: 24px;
    }
    .email-gate p {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .email-form {
      display: flex;
      gap: 8px;
      max-width: 380px;
      margin: 0 auto;
    }
    .email-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-medium);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .email-input:focus {
      border-color: var(--accent-primary);
    }
    .email-input::placeholder {
      color: var(--text-muted);
    }
    .email-submit {
      padding: 12px 24px;
      background: var(--accent-primary);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .email-submit:hover { opacity: 0.85; }
    .email-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .email-error {
      font-size: 13px;
      color: #e55;
      margin-top: 8px;
      display: none;
    }
    .email-error.visible { display: block; }

    /* Download section hidden until email submitted */
    .download-section { display: none; }
    .download-section.visible { display: block; }

    .success-msg {
      font-size: 14px;
      color: #5c9;
      margin-bottom: 16px;
    }

    .steps {
      text-align: left;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
    }
    .steps h3 {
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    .steps ol {
      padding-left: 20px;
    }
    .steps ol li {
      font-size: 15px;
      color: var(--text-secondary);
      padding: 6px 0;
      line-height: 1.6;
    }

    .requirements {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .buy-link {
      margin-top: 24px;
      font-size: 15px;
    }
    .buy-link a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 500;
    }
    .buy-link a:hover { text-decoration: underline; }

    footer {
      padding: 40px 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    footer a { color: var(--text-secondary); text-decoration: none; }
  </style>
</head>
<body>
  <nav class="nav"><a href="/">MotionAmigo</a></nav>

  <div class="container">
    <h1>Download MotionAmigo</h1>
    <p class="subtitle">Includes a 30-day free trial.</p>

    <div class="download-card">
      <!-- Email gate -->
      <div class="email-gate" id="emailGate">
        <p>Enter your email to download MotionAmigo</p>
        <div class="email-form">
          <input type="email" class="email-input" id="emailInput" placeholder="your@email.com" autocomplete="email">
          <button class="email-submit" id="emailSubmit">Download</button>
        </div>
        <p class="email-error" id="emailError"></p>
      </div>

      <!-- Download link (shown after email) -->
      <div class="download-section" id="downloadSection">
        <p class="success-msg" id="successMsg"></p>
        <a href="https://pub-02e0f08160474e3091173e8761c340e4.r2.dev/MotionAmigo-Installer.dmg" class="download-btn" id="downloadBtn">Download Installer (.dmg)</a>
        <p class="file-size">Requires macOS 12+</p>
      </div>
    </div>

  </div>

  <footer>
    <a href="/">MotionAmigo</a> &middot; <a href="mailto:motionamigo@gmail.com">Support</a>
  </footer>

  <script>
    (function() {
      var API = 'https://motionamigo-license.rodrickmiguel.workers.dev';
      var emailInput = document.getElementById('emailInput');
      var emailSubmit = document.getElementById('emailSubmit');
      var emailError = document.getElementById('emailError');
      var emailGate = document.getElementById('emailGate');
      var downloadSection = document.getElementById('downloadSection');
      var successMsg = document.getElementById('successMsg');

      function showError(msg) {
        emailError.textContent = msg;
        emailError.classList.add('visible');
      }
      function hideError() {
        emailError.classList.remove('visible');
      }

      emailSubmit.addEventListener('click', function() {
        hideError();
        var email = (emailInput.value || '').trim().toLowerCase();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('Please enter a valid email address.');
          return;
        }

        emailSubmit.disabled = true;
        emailSubmit.textContent = 'Sending...';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', API + '/api/trial/signup', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 15000;

        xhr.onload = function() {
          var data;
          try { data = JSON.parse(xhr.responseText); } catch(e) { data = {}; }

          if (xhr.status >= 200 && xhr.status < 300 && data.success) {
            // Success — show download link
            emailGate.style.display = 'none';
            downloadSection.classList.add('visible');
            successMsg.textContent = 'Your trial key has been sent to ' + email;
          } else {
            emailSubmit.disabled = false;
            emailSubmit.textContent = 'Download';
            var msg = data.error || data.message || 'Something went wrong. Please try again.';
            if (msg === 'A trial has already been issued for this email') {
              // Already signed up — just show the download
              emailGate.style.display = 'none';
              downloadSection.classList.add('visible');
              successMsg.textContent = 'Welcome back! Your download is ready.';
            } else {
              showError(msg);
            }
          }
        };

        xhr.onerror = function() {
          emailSubmit.disabled = false;
          emailSubmit.textContent = 'Download';
          showError('Cannot reach server. Please check your internet connection.');
        };

        xhr.ontimeout = function() {
          emailSubmit.disabled = false;
          emailSubmit.textContent = 'Download';
          showError('Request timed out. Please try again.');
        };

        xhr.send(JSON.stringify({ email: email }));
      });

      emailInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') emailSubmit.click();
      });
    })();
  </script>
</body>
</html>
